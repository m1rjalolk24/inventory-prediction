services:
  api:
    build: .
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:////app/korzinka.db
    volumes:
      - /home/azureuser/app/models:/app/models
      - /home/azureuser/app/data:/app/data
      - /home/azureuser/app/korzinka.db:/app/korzinka.db
    expose:
      - "5000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - /home/azureuser/app/frontend/dist:/usr/share/nginx/html:ro
      - ./deployment/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
